version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-vite-app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    hostname: react-vite-app
    command: npm run dev -- --host
